site_name: Timeshift for Mere Mortals
site_description: System snapshots you can roll back to. Timeshift copies your system exactly as it stands, keeps a shelf of dated snapshots that share every unchanged file between them, and puts the whole machine back the way it was when an update or a change goes wrong, with the limits stated plainly.
site_url: https://paulsullivan33-dev.github.io/timeshift-for-mere-mortals/
